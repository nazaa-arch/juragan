[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "juragan"
version = "0.1.0"
description = "JURAGAN: MCP-based AI data agent for Indonesian small shops (sales, stock, restock planning, reports)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Naza Firmansyah" }]
dependencies = [
    "mcp>=2.3,<3",
    "anthropic[mcp]>=2.12",
    "httpx>=0.27",
    "anyio>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
juragan = "juragan.cli:main"
juragan-mcp = "juragan.mcp_server:main"

[tool.setuptools]
packages = ["juragan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
